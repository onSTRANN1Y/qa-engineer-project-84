---
- summary: |
    Выбранный язык 'Russian' сбрасывается на 'English' после обновления страницы
  environment: |
    Яндекс-браузер версия 26.6.5.631 (64-bit)
    OC Windows 11 Pro 26H1 28000.2704
  steps-to-reproduce: |
    1. Зайти на страницу сайта - https://products-store.hexlet.app/
    2. Нажать на кнопку 'Language' сверху экрана
    3. В сплывающей форме выбрать язык 'Russian'
    4. Обновить старницу сайта нажатием кнопки 'F5'
  expected-result: |
    Язык сохранился и интерфейс сайта отображается на русском языке
  actual-result: |
    Язык не сохранился и сайт отоброжается на английском языке

- summary: |
    Отображается успешное уведомление об оформлении заказа при ответе сервера 500 Internal Server Error на POST /orders
  environment: |
    Яндекс Браузер версия 26.6.5.631 (64-bit)
    ОС Windows 11 Pro 26H1 28000.2704
  prerequisites: |
    Открыта панель DevTools (вкладка Network)
  steps-to-reproduce: |
    1. Зайти на страницу сайта - https://products-store.hexlet.app/
    2. Ввести название товара 'Lemon' в поисковое окно
    3. Добавить товар в корзину нажатием кнопки 'add to cart'
    4. Перейти в корзину нажатием кнопки 'cart' сверху экрана
    5. Нажать кнопку 'Checkout' для оформления заказа
  expected-result: |
    Запрос POST /orders возвращает статус 200 OK, отображается уведомление об успешном оформлении заказа.
  actual-result: |
    Запрос POST /orders возвращает статус 500 Internal Server Error, но в UI отображается уведомление об успешном оформлении заказа.

- summary: |
    Проверка на корректное отображение верстки элементов интерфейса при переключении языка на испанский (Spanish)
  environment: |
    Яндекс Браузер версия 26.6.5.631 (64-bit)
    ОС Windows 11 Pro 26H1 28000.2704
  prerequisites: |
    Открыта главная страница сайта - https://products-store.hexlet.app/
  steps-to-reproduce: |
    1. Нажать кнопку 'Language' в шапке сайта
    2. Выбрать язык 'Spanish' из выпадающего списка
  expected-result: |
    1. Отсутствуют наложения текста (text overlap), выходы за границы кнопок/блоков и невалидные переносы слов.
    2. Элементы шапки, карточек товаров и футера сохраняют исходные пропорции и выравнивание.
  actual-result: |
    1. Старая зачеркнутая цена визуально накладывается на текущую цену.
    2. Кнопка 'Agregar al carrito' перекрывает блок с ценой и выходит за границы карточки.
