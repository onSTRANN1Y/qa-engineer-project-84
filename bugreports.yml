---
- summary: |
    Фильтрация каталога (по бренду, категории) применяется только в пределах текущей страницы пагинации
  environment: |
    Яндекс Браузер версия 26.6.5.631 (64-bit)
    ОС Windows 11 Pro 26H1 28000.2704
  prerequisites: |
    Открыта главная страница — https://products-store.hexlet.app/
  steps:
    - 1. Перейти на 2-ю или 3-ю страницу каталога товаров с помощью кнопки 'Next'.
    - 2. Применить любой фильтр (например, выбрать бренд 'Apple' или категорию 'Beauty').
  expected-result: |
    1. Пагинация автоматически сбрасывается на 1-ю страницу.
    2. Отображаются все товары из всего каталога магазина, соответствующие выбранному фильтру.
  actual-result: |
    1. Номер страницы не сбрасывается (остается 2-я или 3-я страница).
    2. Фильтрация применяется только к той выборке товаров, которая отображалась на текущей странице до применения фильтра.

- summary: |
    Фильтрация по цене не учитывает акционную стоимость со скидкой
  environment: |
    Яндекс Браузер версия 26.6.5.631 (64-bit)
    ОС Windows 11 Pro 26H1 28000.2704
  prerequisites: |
    Открыта главная страница — https://products-store.hexlet.app/
  steps:
    - 1. В форме фильтрации по цене 'From-To:' ввести значения '10' и '20'.
  expected-result: |
    В результаты фильтрации попадают товары, чья итоговая цена (с учетом скидки) находится в диапазоне от 10 до 20 долларов.
  actual-result: |
    Товары, итоговая цена которых со скидкой попадает в указанный диапазон, не отображаются в результатах.

- summary: |
    Отсутствует переход на страницу оплаты при оформлении заказа
  environment: |
    Яндекс Браузер версия 26.6.5.631 (64-bit)
    ОС Windows 11 Pro 26H1 28000.2704
  prerequisites: |
    Открыта страница корзины — https://products-store.hexlet.app/cart
    В корзину добавлен товар
  steps:
    - 1. Нажать кнопку 'Checkout'.
  expected-result: |
    Осуществляется переход на страницу оплаты заказа.
  actual-result: |
    Переход на страницу оплаты не происходит; отображается лишь всплывающее сообщение об успешном оформлении.

- summary: |
    Некорректное отображение мобильной версии сайта
  environment: |
    Яндекс Браузер версия 26.6.5.631 (64-bit)
    ОС Windows 11 Pro 26H1 28000.2704
  prerequisites: |
    Открыта главная страница — https://products-store.hexlet.app/
    Открыт инструмент DevTools
  steps:
    - 1. В DevTools переключиться на мобильное отображение сайта по кнопке 'Toggle device toolbar' или комбинацией (Ctrl + Shift + M).
    - 2. Посмотреть, как отображается сайт.
  expected-result: |
    1. Мобильная версия сайта подстраивается под разрешение телефона.
    2. Отсутствуют наложения текста (text overlap), выходы за границы кнопок/блоков и невалидные переносы слов.
    3. Элементы шапки, карточек товаров и футера сохраняют исходные пропорции и выравнивание.
  actual-result: |
    1. Все элементы интерфейса перемешаны.
    2. Элементы визуально перекрывают друг друга, навигация затруднена.
    3. Отступы не соблюдены, происходит наложение текста на текст.
    4. Элементы шапки, карточек товаров и футера не сохраняют пропорции и выравнивание.

- summary: |
    Интерфейс сайта смещен влево, отсутствует выравнивание по центру экрана
  environment: |
    Яндекс Браузер версия 26.6.5.631 (64-bit)
    ОС Windows 11 Pro 26H1 28000.2704
  prerequisites: |
    Открыта главная страница — https://products-store.hexlet.app/
  steps:
    - 1. Оценить визуальное оформление и расположение блоков на главной странице.
  expected-result: |
    1. Сайт визуально отображается корректно.
    2. Основной контент и сетка товаров выравнены по центру экрана.
  actual-result: |
    1. Интерфейс и карточки товаров сильно смещены к левому краю экрана.

- summary: |
    Неполная локализация интерфейса при выборе русского языка
  environment: |
    Яндекс Браузер версия 26.6.5.631 (64-bit)
    ОС Windows 11 Pro 26H1 28000.2704
  prerequisites: |
    Открыта главная страница — https://products-store.hexlet.app/
  steps:
    - 1. Нажать кнопку 'Language' в шапке сайта.
    - 2. Выбрать язык 'Russian' из выпадающего списка.
  expected-result: |
    Все элементы интерфейса, включая названия и описания товаров, переведены на русский язык.
  actual-result: |
    Названия товаров и их описания остаются на английском языке.

- summary: |
    Выбранный язык интерфейса сбрасывается на 'English' после обновления страницы
  environment: |
    Яндекс Браузер версия 26.6.5.631 (64-bit)
    ОС Windows 11 Pro 26H1 28000.2704
  prerequisites: |
    Открыта главная страница — https://products-store.hexlet.app/
  steps:
    - 1. Нажать кнопку 'Language' в шапке сайта.
    - 2. Выбрать язык 'Russian' или 'Spanish' из выпадающего списка.
    - 3. Обновить страницу нажатием клавиши F5.
  expected-result: |
    Выбранный язык сохраняется, интерфейс сайта продолжает отображаться на выбранном языке.
  actual-result: |
    Выбранный язык сбрасывается, сайт возвращается к отображению на английском языке.

- summary: |
    Нарушение верстки карточки товара при переключении языка на испанский (Spanish)
  environment: |
    Яндекс Браузер версия 26.6.5.631 (64-bit)
    ОС Windows 11 Pro 26H1 28000.2704
  prerequisites: |
    Открыта главная страница — https://products-store.hexlet.app/
  steps:
    - 1. Нажать кнопку 'Language' в шапке сайта.
    - 2. Выбрать язык 'Spanish' из выпадающего списка.
  expected-result: |
    1. Отсутствуют наложения текста (text overlap), выходы за границы кнопок/блоков и невалидные переносы слов.
    2. Элементы шапки, карточек товаров и футера сохраняют исходные пропорции и выравнивание.
  actual-result: |
    1. Старая зачеркнутая цена визуально накладывается на текущую цену.
    2. Кнопка 'Agregar al carrito' перекрывает блок с ценой и выходит за границы карточки.

- summary: |
    Невозможность закрытия уведомления об успешном оформлении заказа
  environment: |
    Яндекс Браузер версия 26.6.5.631 (64-bit)
    ОС Windows 11 Pro 26H1 28000.2704
  prerequisites: |
    Добавлен товар в корзину
    Открыта страница корзины — https://products-store.hexlet.app/cart
  steps:
    - Нажать кнопку 'Checkout'
    - В открывшемся окне нажать крестик
  expected-result: |
    Уведомление успешно закрылось
  actual-result: |
    Уведомление не закрывается, кнопка не работает.

- summary: |
    Нарушение выравнивания элементов в списке товаров корзины
  environment: |
    Яндекс Браузер версия 26.6.5.631 (64-bit)
    ОС Windows 11 Pro 26H1 28000.2704
  prerequisites: |
    Открыта главная страница — https://products-store.hexlet.app/
  steps:
    - Добавить 5 товаров в корзину
    - Нажать кнопку 'Cart'
    - Проверить корректность отображения товаров
  expected-result: |
    1. Все товары были успешно добавлены и отображаются в корзине
    2. Элементы корзины соблюдают пропорции, выравнивание и шрифт
  actual-result: |
    1. Не соблюдается выравнивание рейтинга и количества в списке добавленных товаров.

- summary: |
    Отсутствие очистки корзины после оформления заказа
  environment: |
    Яндекс Браузер версия 26.6.5.631 (64-bit)
    ОС Windows 11 Pro 26H1 28000.2704
  prerequisites: |
    Добавлен товар в корзину
    Открыта страница корзины — https://products-store.hexlet.app/cart
  steps:
    - Нажать кнопку 'Checkout'
    - В открывшемся окне нажать кнопку 'close'
    - Проверить корзину на наличие товаров
  expected-result: |
    1. Корзина успешно очистилась от товаров
  actual-result: |
    1. Все ранее добавленные товары остались на месте, корзина не очистилась

- summary: |
    Отсутствие отображения рейтинга товара на главной странице
  environment: |
    Яндекс Браузер версия 26.6.5.631 (64-bit)
    ОС Windows 11 Pro 26H1 28000.2704
  prerequisites: |
    Открыта главная страница — https://products-store.hexlet.app/
  steps:
    - Проверить корректное отображение названия, рейтинга, цены со скидкой и без скидки товара на главном экране
    - Нажать на просматриваемый товар
    - Проверить корректное отображение названия, рейтинга, цены со скидкой и без скидки товара в карточке товара
  expected-result: |
    1. Рейтинг товаров отображается как на главной странице, так и в карточке самого товара
  actual-result: |
    1. Рейтинг товаров не отображается на главной странице

- summary: |
    Некорректное отображение формы переключения на английский
  environment: |
    Яндекс Браузер версия 26.6.5.631 (64-bit)
    ОС Windows 11 Pro 26H1 28000.2704
  prerequisites: |
    Открыта главная страница — https://products-store.hexlet.app/
  steps:
    - Нажать на форму смены языка
    - Посмотреть на кнопку 'English'
  expected-result: |
    1. Весь сайт и его элементы корректно отображаются и полностью на английском языке
  actual-result: |
    1. Верстка формы выбора английского языка с ошибками
    2. Дублируется слово 'English'
    3. Флаг напротив английского языка не отображается

- summary: |
    Переход в карточку товара при клике за пределами её видимой границы
  environment: |
    Яндекс Браузер версия 26.6.5.631 (64-bit)
    ОС Windows 11 Pro 26H1 28000.2704
  prerequisites: |
    Открыта главная страница — https://products-store.hexlet.app/
  steps:
    - Навести курсор мыши на свободную область рядом с границей карточки товара (за её рамкой)
    - Выполнить клик левой кнопкой мыши
  expected-result: |
    1. Клик за пределами рамки товара не вызывает переход на страницу товара
    2. Кликабельная область строго ограничена видимыми рамками карточки товара
  actual-result: |
    1. При клике за пределами рамки товара происходит переход в карточку соседнего товара
    2. Видимая рамка карточки товара не совпадает с её фактической кликабельной областью
