---
- summary: |
    Краткое описание тест-кейса. Например, проверка входа пользователя с существующими логином и паролем
  requirement: |
    Тестируемое требование. Например, при верном вводе логине и пароля пользователь должен войти в систему
  prerequisites: |
    Это условия, которые необходимы для проведения тест-кейса. Они должны быть выполнены еще до запуска тест-кейса.
    Например, открыта страница логина
  test-data: |
    Тестовые данные
    Логин = ilona Пароль = password
  steps:
    - Вводим логин
    - Вводим пароль
    - Нажимаем кнопку «Войти»
  expected-result: |
    Пользователь должен попасть на главную страницу

- summary: |
    Проверка входа пользователя с несуществующими логином и паролем
  requirement: |
    При неправильном логине или пароле пользователь должен получить сообщение об ошибке
  prerequisites:
    Открыта страница логина
  test-data: |
    Логин = hexlet Пароль = badpass
  steps:
    - Вводим логин
    - Вводим пароль
    - Нажимаем кнопку «Войти»
  expected-result: |
    Пользователь должен попасть на главную страницу

- summary: |
    Проверка на возможность неавторизованного пользователя добавлять товары в корзину
  requirement: |
   Ппри нажатии кнопки добавления товара в корзину, товар должен отобразиться в корзине
  prerequisites: |
   Пользователь не авторизован(гость)
   Открыта главная страница с товарами
  test-data: |
  steps:
    - Нажимаем кнопку 'add to cart'
    - Нажимаем кнопку 'cart' для перехода в корзину
  expected-result: |
    Товар отображается в корзине с названием и ценой

- summary: |
    Проверка на сохранение корзины при обновлении главной старницы не авторизованным пользователем
  requirement: |
   Ппри обновлении страницы сайта, ранее добавленый в корзину товар должен сохраняться
  prerequisites: |
   Пользователь не авторизован(гость)
   Добавлен товар в корзину
   Открыта главная страница с товарами
  test-data: |
  steps:
    - Нажимаем кнопку обновления страницы или кнопку 'F5'
    - Нажимаем кнопку 'cart' для перехода в корзину
  expected-result: |
    Товар отображается в корзине с названием и ценой

- summary: |
    Проверка на корректную работу формы поиска товара не авторизованного пользователя
  requirement: |
    При заполнении формы ввода существующим названием товара, отоброжается нужный товар
  prerequisites: |
    Открыта главная страница ссайта
    Пользователь не авторизованный(гость)
  test-data: |
    Название товара = 'Green Chili Pepper' (в каталоге есть ровно 1 товар с точным совпадением)
  steps:
    - Вводим 'Green Chili Pepper' в форму поиска товара по названию 'Search'
  expected-result: |
    - На старнице должен отображаться только один товар Green Chili Pepper
    - Товар отображается с названием, ценой и картинкой
