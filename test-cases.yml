- summary: |
    Успешный переход между страницами без полной перезагрузки (SPA)
  requirement: |
    Сайт должен быть SPA-приложением, которое не перезагружает страницу
  prerequisites: |
    Открыта главная страница — https://products-store.hexlet.app/
    Открыт инструмент DevTools на вкладке Network с фильтром 'Fetch/XHR'
  test-data: -
  steps:
    - Нажать на кнопку 'Cart'
    - Нажать на кнопку 'Store'
    - Переключить страницу нажатием кнопки 'Next'
    - Вернуться нажатием кнопки 'Previous'
  expected-result: |
    1. Переход на страницу товара происходит мгновенно без полной перезагрузки HTML-документа (вкладка браузера не "крутится").
    2. В логе Network не появляется новых HTML-запросов.
    3. Адрес страницы (URL) в браузерной строке корректно обновляется.

