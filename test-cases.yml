---
- summary: |
    Смена языка интерфейса на Русский
  requirement: |
    При смене языка на русский язык, весь текст интерфейса должен отображатсья на русском языке
  prerequisites: |
    Открыта главная страница - https://products-store.hexlet.app/
    Изначально язык интерфеса 'English'
  steps:
    - Нажимаем кнопку 'Language'
    - В развернувшейся форме выбрать язык 'Russian'
  expected-result: |
    Язык нтерфейсф должен измениться на Русский

- summary: |
    Сайт запоминает выбранный пользователем язык интерфейса
  requirement: |
    При обновление старницы ранее выбранный язык интерфейса не изменится на другой
  prerequisites: |
   Открыта главная страница - https://products-store.hexlet.app/
   Изначально язык интерфеса 'English'
  steps:
    - Нажимаем кнопку 'Language'
    - В развернувшейся форме выбрать язык 'Russian'
    - Обновляем страницу нажатием кнопки обновленеия или 'F5' на клавиатуре
  expected-result: |
    Интерфейс сайта после обновления должен остаться на Русском языке

- summary: |
    Успешное добавление товара в корзину неавторизованным пользователем
  requirement: |
    Ппри нажатии кнопки добавления товара в корзину, товар должен отобразиться в корзине
  prerequisites: |
    Пользователь не авторизован(гость)
    Открыта главная страница с товарами
  test-data: |
  steps:
    - Нажимаем кнопку 'add to cart' для любого товара
    - Нажимаем кнопку 'cart' для перехода в корзину
  expected-result: |
    Выбранный ранее товар отображается в корзине с названием и ценой

- summary: |
    Проверка на сохранение корзины при обновлении главной старницы не авторизованным пользователем
  requirement: |
   Ппри обновлении страницы сайта, ранее добавленый в корзину товар должен сохраняться
  prerequisites: |
   Пользователь не авторизован(гость)
   Добавлен товар в корзину
   Открыта главная страница с товарами
  test-data: |
  steps:
    - Нажимаем кнопку обновления страницы или кнопку 'F5'
    - Нажимаем кнопку 'cart' для перехода в корзину
  expected-result: |
    Товар отображается в корзине с названием и ценой

- summary: |
    Проверка на корректную работу формы поиска товара не авторизованного пользователя
  requirement: |
    При заполнении формы ввода существующим названием товара, отоброжается нужный товар
  prerequisites: |
    Открыта главная страница ссайта
    Пользователь не авторизованный(гость)
  test-data: |
    Название товара = 'Green Chili Pepper' (в каталоге есть ровно 1 товар с точным совпадением)
  steps:
    - Вводим 'Green Chili Pepper' в форму поиска товара по названию 'Search'
  expected-result: |
    - На старнице должен отображаться только один товар Green Chili Pepper
    - Товар отображается с названием, ценой и картинкой
