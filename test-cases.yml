---
- summary: |
    Корректная смена языка интерфейса на русский
  requirement: |
    При смене языка на русский язык, весь текст интерфейса должен отображаться на русском языке
  prerequisites: |
    Открыта главная страница - https://products-store.hexlet.app/
    Изначально язык интерфейса 'English'
  steps:
    - Нажимаем кнопку 'Language'
    - В развернувшейся форме выбрать язык 'Russian'
  expected-result: |
    Язык интерфейса должен измениться на русский

- summary: |
    Сайт запоминает выбранный пользователем язык интерфейса
  requirement: |
    При обновлении страницы ранее выбранный язык интерфейса не изменится на другой
  prerequisites: |
    Открыта главная страница - https://products-store.hexlet.app/
    Изначально язык интерфейса 'English'
  steps:
    - Нажимаем кнопку 'Language'
    - В развернувшейся форме выбрать язык 'Russian'
    - Обновляем страницу нажатием кнопки обновления или 'F5' на клавиатуре
  expected-result: |
    Интерфейс сайта после обновления должен остаться на русском языке

- summary: |
    Успешное добавление товара в корзину неавторизованным пользователем
  requirement: |
    При нажатии кнопки добавления товара в корзину, товар должен отобразиться в корзине
  prerequisites: |
    Пользователь не авторизован (гость)
    Открыта главная страница с товарами
  steps:
    - Нажимаем кнопку 'add to cart' для любого товара
    - Нажимаем кнопку 'cart' для перехода в корзину
  expected-result: |
    Выбранный ранее товар отображается в корзине с названием и ценой

- summary: |
    Проверка на сохранение корзины при обновлении главной страницы неавторизованным пользователем
  requirement: |
    При обновлении страницы сайта, ранее добавленный в корзину товар должен сохраняться
  prerequisites: |
    Пользователь не авторизован (гость)
    Добавлен товар в корзину
    Открыта главная страница - https://products-store.hexlet.app/
  steps:
    - Нажимаем кнопку обновления страницы или кнопку 'F5'
    - Нажимаем кнопку 'cart' для перехода в корзину
  expected-result: |
    Товар отображается в корзине с названием и ценой

- summary: |
    Проверка на корректную работу формы поиска товара неавторизованного пользователя
  requirement: |
    При заполнении формы ввода существующим названием товара, отображается нужный товар
  prerequisites: |
    Открыта главная страница сайта
    Пользователь не авторизован (гость)
  test-data: |
    Название товара = 'Green Chili Pepper' (в каталоге есть ровно 1 товар с точным совпадением)
  steps:
    - Вводим 'Green Chili Pepper' в форму поиска товара по названию 'Search'
  expected-result: |
    На странице должен отображаться только один товар Green Chili Pepper. Товар отображается с названием, ценой и картинкой

- summary: |
    Успешное оформление заказа
  requirement: |
    После добавления товара в корзину заказ можно успешно оформить
  prerequisites: |
    Открыта страница корзины с 1 добавленным товаром
    Открыт DevTools (кнопка F12) и выбрана вкладка 'Network'
  steps:
    - Нажимаем кнопку оформления заказа 'checkout'
  expected-result: |
    Выводится всплывающее окно с сообщением об успешном оформлении заказа. В DevTools появилась строка с именем 'orders' и статус-кодом '200'
