bugreports:
  - summary: |
      Язык интерфейса сбрасывается с выбранного на английский при нажатии кнопки 'Магазин'
    environment: |
      Яндекс-браузер версия 26.6.5.631 (64-bit)
      OC Windows 11 Pro 26H1 28000.2704
    steps-to-reproduce: |
    1. Зайти на страницу сайта - https://products-store-v2.hexlet.app/
    2. Нажать на кнопку 'Language' сверху экрана
    3. В сплывающей форме выбрать язык 'Russian'
    4. Нажать кнопку 'Магазин'
    expected-result: |
      Язык интерфейса остается на русском
    actual-result: |
      Язык интерфейса сменился на английский
      
- summary: |
    Не работает фильтрация товаров по наличию при снятии чекбокса 'In Stock'
  environment: |
    Яндекс Браузер версия 26.6.5.631 (64-bit)
    ОС Windows 11 Pro 26H1 28000.2704
  steps-to-reproduce: |
    1. Перейти на главную страницу сайта - https://products-store-v2.hexlet.app/
    2. Убедиться, что чекбокс 'In Stock' в боковой панели фильтров отмечен
    3. Снять галочку с чекбокса 'In Stock'
  expected-result: |
    Список товаров обновляется: отображаются только товары, которых нет в наличии (или скрываются товары в наличии)
  actual-result: |
    Фильтрация не происходит, товары в наличии продолжают отображаться в каталоге
