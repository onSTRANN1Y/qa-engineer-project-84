bugreports:
  - summary: |
      Язык интерфейса сбрасывается с выбранного на английский при нажатии кнопки 'Store'
    environment: |
      Яндекс Браузер версия 26.6.5.631 (64-bit)
      ОС Windows 11 Pro 26H1 28000.2704
    steps-to-reproduce: |
      1. Зайти на страницу сайта - https://products-store.hexlet.app/
      2. Нажать на кнопку 'Language' в шапке сайта.
      3. В всплывающей форме выбрать язык 'Russian'.
      4. Нажать кнопку 'Store'.
    expected-result: |
      Язык интерфейса остается на русском.
    actual-result: |
      Язык интерфейса сменяется на английский.

  - summary: |
      Переход между страницами происходит с полной перезагрузкой (нарушена концепция SPA)
    environment: |
      Яндекс Браузер версия 26.6.5.631 (64-bit)
      ОС Windows 11 Pro 26H1 28000.2704
    prerequisites: |
      Открыта главная страница - https://products-store.hexlet.app/
      Открыт инструмент DevTools на вкладке Network
    steps-to-reproduce: |
      1. Нажать на кнопку 'Store' в шапке сайта.
    expected-result: |
      Переход происходит без полной перезагрузки страницы (по концепции SPA), список запросов в Network не очищается.
    actual-result: |
      Страница перезагружается полностью, происходит сброс логов во вкладке Network.

  - summary: |
      При поиске несуществующего товара сбрасывается фильтрация и отображается весь каталог
    environment: |
      Яндекс Браузер версия 26.6.5.631 (64-bit)
      ОС Windows 11 Pro 26H1 28000.2704
    prerequisites: |
      Открыта главная страница - https://products-store.hexlet.app/
    steps-to-reproduce: |
      1. Ввести в поисковую строку заведомо несуществующий товар 'qwerty12345'
    expected-result: |
      Сайт уведомляет, что товаров с таким названием не найдено.
    actual-result: |
      Фильтрация полностью сбрасывается и отображается весь каталог товаров.
